# Build the server image from a published release's wheel and push it to GHCR.
# Runs when a release is published here, or by hand with a version.
name: docker
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version: { description: "Release version (e.g. 0.1.1)", required: true }
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Free disk space for the CUDA and torch layers"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h / | tail -1
      - id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF#refs/tags/v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/zenedgex/proprio:${{ steps.v.outputs.version }}
            ghcr.io/zenedgex/proprio:latest
          labels: |
            org.opencontainers.image.title=Proprio
            org.opencontainers.image.description=Exact inference server for VLA robot policies
            org.opencontainers.image.source=https://github.com/zenedgex/proprio-releases
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.vendor=ZenEdgeX
      - name: "Smoke test: CLI and licence check inside the image (CPU)"
        run: |
          docker run --rm --entrypoint proprio ghcr.io/zenedgex/proprio:${{ steps.v.outputs.version }} licence || test $? -eq 2
          docker run --rm --entrypoint python ghcr.io/zenedgex/proprio:${{ steps.v.outputs.version }} -c "import proprio, torch, lerobot; print('proprio', proprio.__version__ if hasattr(proprio,'__version__') else 'ok', 'torch', torch.__version__)"
